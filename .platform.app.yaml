# Upsun (fixed organisation): one PHP app, SQLite on a persistent mount. Every push to main deploys.
name: app
type: "php:8.4"
disk: 1024
build:
  flavor: none
variables:
  env:
    APP_ENV: prod
    APP_DEBUG: "0"
mounts:
  "/var":
    source: local
    source_path: var
web:
  locations:
    "/":
      root: "public"
      passthru: "/index.php"
      expires: 1h
hooks:
  build: |
    set -eux
    composer install --no-dev --no-interaction --no-progress --optimize-autoloader
    php bin/console asset-map:compile
  deploy: |
    set -eux
    php bin/console cache:clear
    php bin/console doctrine:schema:update --force
