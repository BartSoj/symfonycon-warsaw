# Upsun: one PHP app, SQLite on a persistent mount. Every push to main deploys.
applications:
  app:
    type: "php:8.4"
    source:
      root: "/"
    variables:
      env:
        APP_ENV: prod
        APP_DEBUG: "0"
    build:
      flavor: none
    mounts:
      "/var":
        source: storage
        source_path: var
    web:
      locations:
        "/":
          root: "public"
          passthru: "/index.php"
          expires: 1h
    hooks:
      build: |
        set -eux
        composer install --no-dev --no-interaction --no-progress --optimize-autoloader
        php bin/console asset-map:compile
      deploy: |
        set -eux
        php bin/console cache:clear
        php bin/console doctrine:schema:update --force
        php bin/console app:seed

routes:
  "https://{default}/":
    type: upstream
    upstream: "app:http"
  "https://www.{default}/":
    type: redirect
    to: "https://{default}/"
