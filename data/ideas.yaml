# Strategy ideas for Bot Arena bots, shown on the home page. bin/ship records the id when you pass it.
# level: quick (a few lines), medium (a small algorithm), big (for the ambitious)
- id: survivor
  title: 🛟 The survivor
  pitch: Never drive into a wall or a trail. Go straight while it's safe, otherwise turn. That's Rookie, and it loses to The House.
  level: quick
- id: wall-hugger
  title: 🧱 The wall hugger
  pitch: Stay close to walls and trails so you waste no space, like filling a room from the edges.
  level: quick
- id: flood-fill
  title: 🌊 Count the space
  pitch: Before each move, flood-fill from every safe cell and go where the most free cells are reachable. Never get trapped in a pocket.
  level: medium
- id: no-head-on
  title: 🙅 No head-on crashes
  pitch: Avoid the cells the opponent could reach next. A draw is no win.
  level: quick
- id: hunter
  title: 🎯 The hunter
  pitch: Drive towards the opponent's head and cut them off, so they run out of room before you do.
  level: medium
- id: territory
  title: 🗺️ Territory (Voronoi)
  pitch: Count the cells you reach before the opponent does, and pick the move that gives you the most territory.
  level: big
- id: lookahead
  title: 🧠 Think ahead
  pitch: Minimax a few moves deep, with your move and theirs, and score each position by territory.
  level: big
- id: zigzag
  title: 〰️ Zig-zag
  pitch: Snake back and forth in tight rows to fill your area without leaving holes.
  level: quick
